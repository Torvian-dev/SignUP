# Try it in one command:   ./try-it.sh
# Or manually:             ./scripts/dev-secrets.sh > .env  &&  docker compose run --rm migrate  &&  docker compose up --build
# Then open http://localhost:3000 and sign in with the admin shown by the script.
#
# A fictional "practice" site is included at http://practice:5055 so you can test with no API keys.
# The `navigator` sidecar (open-ended navigation fallback) is optional: add it with  --profile full
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: formagent
      POSTGRES_PASSWORD: formagent
      POSTGRES_DB: formagent
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U formagent"], interval: 5s, retries: 15 }

  # One-shot: applies db/migrations (tracked in schema_migrations) + seed.  Run once before `up`.
  migrate:
    image: postgres:16
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
    volumes: ["./db:/db:ro"]
    entrypoint: ["sh", "-c", "sh /db/migrate.sh /db/migrations && psql \"$$DATABASE_URL\" -q -f /db/seed.sql"]
    depends_on: { postgres: { condition: service_healthy } }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      NAVIGATOR_URL: http://navigator:8088
      # Lets the agent reach the bundled practice site (a private host). Leave off in production.
      ALLOW_PRIVATE_TARGETS: "true"
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      REDIS_URL: redis://redis:6379
      NAVIGATOR_URL: http://navigator:8088
      ALLOW_PRIVATE_TARGETS: "true"
      WORKER_CONCURRENCY: "2"
    shm_size: "1gb"   # Chromium needs more than Docker's 64MB default
    depends_on: [api]

  # Bundled practice site for trying the agent without any real website or API keys.
  practice:
    image: node:22-bookworm-slim
    working_dir: /site
    command: ["node", "server.mjs"]
    environment: { PORT: "5055" }
    volumes: ["./apps/api/test/practice-site:/site:ro"]
    ports: ["5055:5055"]

  # Optional: open-ended navigation fallback (Browser Use, Python). Heavier build; enable with --profile full.
  navigator:
    build: { context: ., dockerfile: infra/docker/navigator.Dockerfile }
    env_file: .env
    profiles: ["full"]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      AUTH_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
