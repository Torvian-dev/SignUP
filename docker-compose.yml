# Local development stack:  docker compose up --build
# First time:  ./scripts/dev-secrets.sh > .env && docker compose up -d postgres && docker compose run --rm migrate
# Then: http://localhost:3000  (API on :4000)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: formagent
      POSTGRES_PASSWORD: formagent
      POSTGRES_DB: formagent
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U formagent"], interval: 5s, retries: 10 }

  # One-shot: applies db/migrations (tracked in schema_migrations) + seed.  docker compose run --rm migrate
  migrate:
    image: postgres:16
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
    volumes: ["./db:/db:ro"]
    entrypoint: ["sh", "-c", "sh /db/migrate.sh /db/migrations && psql \"$$DATABASE_URL\" -q -f /db/seed.sql"]
    depends_on: { postgres: { condition: service_healthy } }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      NAVIGATOR_URL: http://navigator:8088
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      REDIS_URL: redis://redis:6379
      NAVIGATOR_URL: http://navigator:8088
      WORKER_CONCURRENCY: "2"
    shm_size: "1gb"   # Chromium needs more than Docker's 64MB default
    depends_on: [api]

  navigator:
    build: { context: ., dockerfile: infra/docker/navigator.Dockerfile }
    env_file: .env

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
      DATABASE_URL: postgres://formagent:formagent@postgres:5432/formagent
      AUTH_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
