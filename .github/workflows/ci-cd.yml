name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC federation to Azure — no long-lived cloud secrets in GitHub
  security-events: write

env:
  ACR: ${{ vars.ACR_NAME }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: formagent }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
      redis: { image: redis:7.4-alpine, ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations to a fresh database (twice — must be idempotent)
        env: { DATABASE_URL: "postgres://postgres:test@localhost:5432/formagent" }
        run: sh ../../db/migrate.sh && sh ../../db/migrate.sh

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env: { AUTH_SECRET: ci-only, API_INTERNAL_URL: http://localhost:4000 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Dependency audit
        run: |
          (cd apps/api && npm audit --omit=dev --audit-level=high)
          (cd apps/web && npm audit --omit=dev --audit-level=high)

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, security]
    runs-on: ubuntu-latest
    strategy:
      matrix: { image: [api, worker, web, navigator] }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$ACR"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ env.ACR }}.azurecr.io/formagent-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR }}.azurecr.io/formagent-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy-staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { client-id: "${{ vars.AZURE_CLIENT_ID }}", tenant-id: "${{ vars.AZURE_TENANT_ID }}", subscription-id: "${{ vars.AZURE_SUBSCRIPTION_ID }}" }
      - uses: azure/aks-set-context@v4
        with: { resource-group: "${{ vars.AKS_RG }}", cluster-name: "${{ vars.AKS_NAME }}-staging" }
      - name: Run DB migrations (migration role from Key Vault, not the app role)
        run: |
          kubectl -n formagent create configmap migrations-${{ github.run_id }} --from-file=db/migrations/ --from-file=db/migrate.sh
          kubectl -n formagent run migrate-${{ github.run_id }} --rm -i --restart=Never --image=postgres:16 --overrides='{
            "spec": {
              "volumes": [{ "name": "m", "configMap": { "name": "migrations-${{ github.run_id }}" } }],
              "containers": [{
                "name": "migrate", "image": "postgres:16",
                "command": ["sh", "-c", "mkdir -p /tmp/mig && cp /m/*.sql /tmp/mig/ && sh /m/migrate.sh /tmp/mig"],
                "envFrom": [{ "secretRef": { "name": "formagent-migration" } }],
                "volumeMounts": [{ "name": "m", "mountPath": "/m" }]
              }]
            }
          }'
      - name: Deploy
        run: |
          export TAG=${{ github.sha }} ACR=$ACR
          envsubst < infra/k8s/base.yaml | kubectl apply -f -
          kubectl -n formagent rollout status deploy/api deploy/web deploy/worker --timeout=10m
      - name: Smoke test
        run: curl -fsS https://staging.formagent.example/login > /dev/null

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production        # required reviewers configured on the environment
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { client-id: "${{ vars.AZURE_CLIENT_ID }}", tenant-id: "${{ vars.AZURE_TENANT_ID }}", subscription-id: "${{ vars.AZURE_SUBSCRIPTION_ID }}" }
      - uses: azure/aks-set-context@v4
        with: { resource-group: "${{ vars.AKS_RG }}", cluster-name: "${{ vars.AKS_NAME }}" }
      - run: |
          export TAG=${{ github.sha }} ACR=$ACR
          envsubst < infra/k8s/base.yaml | kubectl apply -f -
          kubectl -n formagent rollout status deploy/api deploy/web deploy/worker --timeout=15m
